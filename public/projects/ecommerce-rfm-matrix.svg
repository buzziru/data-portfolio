<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="1200" height="460" fill="#e8e6e0"/>

  <text x="48" y="34" font-family="'IBM Plex Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#7b7f7d">RFM · CORE SEGMENTS</text>
