<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="324" fill="#e8e6e0"/>

  <text x="18" y="32" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.6" fill="#7b7f7d">RFM · CORE SEGMENTS</text>
  <text x="18" y="64" font-size="21" font-weight="600" letter-spacing="-0.4" fill="#101214">RFM에 따른 핵심 고객 분류</text>

  <!-- Column headers — 두 줄로 접어 열폭을 줄인다 (한 줄이면 720px 에 4열이 안 들어간다) -->
  <g font-size="12" font-weight="600" fill="#101214" text-anchor="middle">
    <rect x="154" y="86" width="131" height="44" fill="#dedbd3" stroke="#c4c1b8"/>
    <text x="219.5" y="104">Loyal</text><text x="219.5" y="120">Champions</text>
    <rect x="293" y="86" width="131" height="44" fill="#dedbd3" stroke="#c4c1b8"/>
