    <rect x="516" y="110" width="200" height="56" fill="#dedbd3" stroke="#c4c1b8"/><text x="616" y="144">Potential Loyalist</text>
    <rect x="732" y="110" width="200" height="56" fill="#dedbd3" stroke="#c4c1b8"/><text x="832" y="144">Promising Newcomers</text>
    <rect x="948" y="110" width="200" height="56" fill="#dedbd3" stroke="#c4c1b8"/><text x="1048" y="144">Bargain Lovers</text>
  </g>

  <!-- Row: Recency  ▲ ▼ ▲ ▲ -->
