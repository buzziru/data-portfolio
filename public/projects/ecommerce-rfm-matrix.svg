<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="366" fill="#e8e6e0"/>

  <text x="28" y="36" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.6" fill="#7b7f7d">RFM · CORE SEGMENTS</text>
  <text x="28" y="70" font-size="21" font-weight="600" letter-spacing="-0.4" fill="#101214">RFM에 따른 핵심 고객 분류</text>

  <!-- 칸 크기는 안에 들어갈 글자 폭에서 역산한다. 라벨 칸 139 = 마커 14 + 글자 94("Monetary Value") + 여백 31.
       열 칸 116 = 글자 67("Newcomers") + 좌우 24.5. 칸 사이 15~16, 바깥 여백 28 — 칸을 붙여 놓으면
       격자가 아니라 한 덩어리로 읽힌다. 열 머리는 두 줄로 접는다(한 줄이면 720px 에 4열이 안 들어간다). -->
  <g font-size="12" font-weight="600" fill="#101214" text-anchor="middle">
    <rect x="183" y="100" width="116" height="46" fill="#dedbd3" stroke="#c4c1b8"/>
    <text x="241" y="118">Loyal</text><text x="241" y="134">Champions</text>
    <rect x="314" y="100" width="116" height="46" fill="#dedbd3" stroke="#c4c1b8"/>
    <text x="372" y="118">Potential</text><text x="372" y="134">Loyalist</text>
    <rect x="445" y="100" width="116" height="46" fill="#dedbd3" stroke="#c4c1b8"/>
    <text x="503" y="118">Promising</text><text x="503" y="134">Newcomers</text>
    <rect x="576" y="100" width="116" height="46" fill="#dedbd3" stroke="#c4c1b8"/>
    <text x="634" y="118">Bargain</text><text x="634" y="134">Lovers</text>
  </g>

  <!-- Recency  ▲ ▼ ▲ ▲ -->
  <g>
    <rect x="28" y="160" width="139" height="54" fill="#dedbd3" stroke="#c4c1b8"/>
    <rect x="42" y="179" width="2.5" height="16" fill="#101214"/>
    <text x="54" y="192" font-size="13" font-weight="500" fill="#3d4144">Recency</text>
    <rect x="183" y="160" width="116" height="54" fill="#e8e6e0" stroke="#c4c1b8"/><polygon points="241,179 231,196 251,196" fill="#0b6e4f"/>
    <rect x="314" y="160" width="116" height="54" fill="#e8e6e0" stroke="#c4c1b8"/><polygon points="372,196 362,179 382,179" fill="#b3651a"/>
    <rect x="445" y="160" width="116" height="54" fill="#e8e6e0" stroke="#c4c1b8"/><polygon points="503,179 493,196 513,196" fill="#0b6e4f"/>
    <rect x="576" y="160" width="116" height="54" fill="#e8e6e0" stroke="#c4c1b8"/><polygon points="634,179 624,196 644,196" fill="#0b6e4f"/>
  </g>

  <!-- Frequency  ▲ ▲ ▼ ▲ -->
  <g>
    <rect x="28" y="222" width="139" height="54" fill="#dedbd3" stroke="#c4c1b8"/>
    <rect x="42" y="241" width="2.5" height="16" fill="#101214"/>
    <text x="54" y="254" font-size="13" font-weight="500" fill="#3d4144">Frequency</text>
    <rect x="183" y="222" width="116" height="54" fill="#e8e6e0" stroke="#c4c1b8"/><polygon points="241,241 231,258 251,258" fill="#0b6e4f"/>
    <rect x="314" y="222" width="116" height="54" fill="#e8e6e0" stroke="#c4c1b8"/><polygon points="372,241 362,258 382,258" fill="#0b6e4f"/>
    <rect x="445" y="222" width="116" height="54" fill="#e8e6e0" stroke="#c4c1b8"/><polygon points="503,258 493,241 513,241" fill="#b3651a"/>
    <rect x="576" y="222" width="116" height="54" fill="#e8e6e0" stroke="#c4c1b8"/><polygon points="634,241 624,258 644,258" fill="#0b6e4f"/>
  </g>

  <!-- Monetary Value  ▲ ▲ ▲ ▼ -->
  <g>
    <rect x="28" y="284" width="139" height="54" fill="#dedbd3" stroke="#c4c1b8"/>
    <rect x="42" y="303" width="2.5" height="16" fill="#101214"/>
    <text x="54" y="316" font-size="13" font-weight="500" fill="#3d4144">Monetary Value</text>
    <rect x="183" y="284" width="116" height="54" fill="#e8e6e0" stroke="#c4c1b8"/><polygon points="241,303 231,320 251,320" fill="#0b6e4f"/>
    <rect x="314" y="284" width="116" height="54" fill="#e8e6e0" stroke="#c4c1b8"/><polygon points="372,303 362,320 382,320" fill="#0b6e4f"/>
    <rect x="445" y="284" width="116" height="54" fill="#e8e6e0" stroke="#c4c1b8"/><polygon points="503,303 493,320 513,320" fill="#0b6e4f"/>
    <rect x="576" y="284" width="116" height="54" fill="#e8e6e0" stroke="#c4c1b8"/><polygon points="634,320 624,303 644,303" fill="#b3651a"/>
  </g>
</svg>
