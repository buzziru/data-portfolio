    <rect x="432" y="86" width="131" height="44" fill="#dedbd3" stroke="#c4c1b8"/>
    <text x="497.5" y="104">Promising</text><text x="497.5" y="120">Newcomers</text>
    <rect x="571" y="86" width="131" height="44" fill="#dedbd3" stroke="#c4c1b8"/>
    <text x="636.5" y="104">Bargain</text><text x="636.5" y="120">Lovers</text>
  </g>

  <!-- Recency  ▲ ▼ ▲ ▲ -->
